<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; form-action 'none'; base-uri 'none'"><title>Acesso • LoteContábil</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6fb;color:#24364e;font:15px system-ui,-apple-system,'Segoe UI',sans-serif}.box{background:white;border:1px solid #dce5f2;box-shadow:0 20px 70px #14294b1a;border-radius:20px;padding:32px;width:min(92vw,420px)}h1{font-size:28px;margin:0;color:#17243d}h1 span{color:#245fda}.subtitle{color:#6b7b94;margin:7px 0 24px}label{display:block;font-size:13px;font-weight:700;margin:17px 0 6px}input{width:100%;padding:13px 14px;border:1px solid #c9d5e5;border-radius:10px;font:inherit}input:focus{outline:2px solid #aac7ff}button{background:#245fda;color:white;font:700 15px system-ui;border:0;border-radius:10px;padding:13px;width:100%;margin-top:25px;cursor:pointer}button:disabled{opacity:.65}.msg{display:none;margin-top:15px;color:#a12b3d;background:#fff2f3;padding:10px;border-radius:8px}.note{color:#75849a;font-size:12px;margin-top:17px;line-height:1.5}</style></head><body><main class="box"><h1>Lote<span>Contábil</span></h1><p class="subtitle">Entre para acessar o piloto.</p><label for="user">Usuário</label><input id="user" autocomplete="username" autofocus><label for="pass">Senha</label><input id="pass" type="password" autocomplete="current-password"><button id="go">Entrar</button><div id="msg" class="msg" role="alert"></div><div class="note">Uma sessão por vez, com duração máxima de 24 horas. Um novo acesso encerra automaticamente o anterior.</div></main><script>
const btn=document.getElementById('go'),msg=document.getElementById('msg');async function login(){btn.disabled=true;btn.textContent='Entrando...';msg.style.display='none';try{const r=await fetch('/api/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('user').value,password:document.getElementById('pass').value})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.message||'Não foi possível entrar');location.replace('/app');}catch(e){msg.textContent=e.message||'Falha ao entrar';msg.style.display='block';}finally{btn.disabled=false;btn.textContent='Entrar';}}
btn.onclick=login;document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});document.getElementById('user').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('pass').focus()});
</script></body></html>
